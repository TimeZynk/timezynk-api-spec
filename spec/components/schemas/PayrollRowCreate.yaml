type: object
description: |
  One calculated Payroll result row.

  `source-type` and its matching field are **required when the parent Payroll was created with
  `save-state: draft`** (the atomic flow all new integrations should use). They determine what the
  completed Payroll claims when finalized, and a row that omits or mismatches them is rejected with
  a `400` from `POST /payroll-rows`:

  - `salary-report` requires a non-empty `report-ids` array, or `400 PAYROLL_ROW_MISSING_REPORT_IDS`.
  - `monthly-salary` requires `source-month` in `YYYY-MM` format, or `400 PAYROLL_ROW_MISSING_SOURCE_MONTH`.
  - `flexitime` requires an inclusive `source-from`/`source-to` interval (`source-from` on or before
    `source-to`), or `400 PAYROLL_ROW_MISSING_SOURCE_INTERVAL`.
  - A missing or unrecognized `source-type` itself returns `400 PAYROLL_ROW_MISSING_SOURCE_TYPE`.

  For a legacy Payroll (`save-state` omitted at creation), source metadata is not validated and may
  be omitted; such rows are never eligible for claim-based duplicate protection. New integrations
  should always use the draft flow and always provide `source-type`.

  The `enum` on `source-type` and the `pattern` on `source-month` below describe the draft-flow
  contract only. The server does not enforce either for a legacy Payroll's rows, so a strict
  client-side validator built from this schema may reject a legacy-flow value the server actually
  accepts. Legacy callers should not validate against this schema.
properties:
  payroll-id:
    type: string
    format: ObjectId
    description: Parent Payroll ID.
  user-id:
    type: string
    format: ObjectId
    description: User to whom the result belongs.
  article-id:
    type: string
    format: ObjectId
    description: Salary article represented by the row.
  count:
    type: number
    description: Calculated quantity. Fractional values are supported.
    example: 7.5
  date:
    type: string
    format: local-date
    pattern: ^\d{4}-\d{2}-\d{2}$
    description: Payroll date associated with the row.
  source-type:
    type: string
    enum: [salary-report, monthly-salary, flexitime]
    description: Type of pay source claimed when the Payroll is finalized.
  report-ids:
    type: array
    minItems: 1
    description: Required when `source-type` is `salary-report`.
    items:
      type: string
      format: ObjectId
  source-month:
    type: string
    pattern: ^\d{4}-\d{2}$
    description: Required when `source-type` is `monthly-salary`.
    example: "2026-08"
  source-from:
    type: string
    format: local-date
    pattern: ^\d{4}-\d{2}-\d{2}$
    description: Required inclusive interval start when `source-type` is `flexitime`.
  source-to:
    type: string
    format: local-date
    pattern: ^\d{4}-\d{2}-\d{2}$
    description: Required inclusive interval end when `source-type` is `flexitime`.
  price:
    type: number
    description: Optional calculated unit price.
  currency:
    type: string
    description: Optional currency code used for the calculated value.
    example: SEK
  duration:
    type: number
    description: |
      Optional duration in milliseconds. Signed: a Flexitime row's duration matches the sign of
      `count`, so a negative value (the employee owes time) is valid and expected. Note the unit
      difference from `PayrollCalculationInputsResponse`'s `flexitime[].value`, which is in
      minutes — multiply that value by 60000 to build this field.
    example: -144000000
  export-data:
    type: object
    description: Integration-specific row data.
    additionalProperties: true
required:
  - payroll-id
  - user-id
  - article-id
  - count
  - date
