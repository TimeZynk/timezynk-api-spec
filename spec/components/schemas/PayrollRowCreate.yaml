type: object
description: |
  One calculated Payroll result row. For the atomic draft flow, source metadata is required and
  determines what the completed Payroll claims:

  - `salary-report` requires a non-empty `report-ids` array.
  - `monthly-salary` requires `source-month` in `YYYY-MM` format.
  - `flexitime` requires an inclusive `source-from`/`source-to` interval.
properties:
  payroll-id:
    type: string
    format: ObjectId
    description: Parent Payroll ID.
  user-id:
    type: string
    format: ObjectId
    description: User to whom the result belongs.
  article-id:
    type: string
    format: ObjectId
    description: Salary article represented by the row.
  count:
    type: number
    description: Calculated quantity. Fractional values are supported.
    example: 7.5
  date:
    type: string
    format: local-date
    pattern: ^\d{4}-\d{2}-\d{2}$
    description: Payroll date associated with the row.
  source-type:
    type: string
    enum: [salary-report, monthly-salary, flexitime]
    description: Type of pay source claimed when the Payroll is finalized.
  report-ids:
    type: array
    minItems: 1
    description: Required when `source-type` is `salary-report`.
    items:
      type: string
      format: ObjectId
  source-month:
    type: string
    pattern: ^\d{4}-\d{2}$
    description: Required when `source-type` is `monthly-salary`.
    example: "2026-08"
  source-from:
    type: string
    format: local-date
    pattern: ^\d{4}-\d{2}-\d{2}$
    description: Required inclusive interval start when `source-type` is `flexitime`.
  source-to:
    type: string
    format: local-date
    pattern: ^\d{4}-\d{2}-\d{2}$
    description: Required inclusive interval end when `source-type` is `flexitime`.
  price:
    type: number
    description: Optional calculated unit price.
  currency:
    type: string
    description: Optional currency code used for the calculated value.
    example: SEK
  duration:
    type: number
    minimum: 0
    description: Optional duration in minutes.
  export-data:
    type: object
    description: Integration-specific row data.
    additionalProperties: true
required:
  - payroll-id
  - user-id
  - article-id
  - count
  - date
