type: object
properties:
  code:
    type: integer
    description: The response's own HTTP status code, repeated in the body.
    example: 409
  error:
    type: string
    enum: [PAYROLL_SOURCE_CONFLICT]
  message:
    type: string
    example: Pay data is already included in an active Payroll.
  conflicts:
    type: array
    items:
      $ref: "#/components/schemas/PayrollSourceConflictDetail"
required:
  - error
  - message
  - conflicts
