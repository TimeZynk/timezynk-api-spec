type: object
properties:
  code:
    type: integer
    description: The response's own HTTP status code, repeated in the body.
    example: 409
  error:
    type: string
    description: Stable machine-readable Payroll error code.
    example: PAYROLL_NOT_DRAFT
  message:
    type: string
    description: Human-readable error description.
  conflicts:
    type: array
    description: Present for pay-source ownership conflicts.
    items:
      $ref: "#/components/schemas/PayrollSourceConflictDetail"
required:
  - error
  - message
