get:
  summary: Fetch completed Payrolls
  description: |
    Returns completed Payrolls only; drafts are never listed. Date filters use interval overlap:
    a Payroll is included when its end date is on or after `from` and its start date is on or
    before `to`.
  tags:
    - Payrolls
  parameters:
    - name: from
      in: query
      description: Earliest overlapping date, inclusive.
      schema:
        type: string
        format: local-date
        pattern: ^\d{4}-\d{2}-\d{2}$
    - name: to
      in: query
      description: Latest overlapping date, inclusive.
      schema:
        type: string
        format: local-date
        pattern: ^\d{4}-\d{2}-\d{2}$
  responses:
    200:
      description: Completed Payrolls matching the interval.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Payroll"
post:
  summary: Create a Payroll draft
  description: |
    Creates one Payroll parent or an array of parents. For the atomic save flow, send one parent
    with `save-state: draft`, then add its rows and finalize it. The server always creates the
    parent with `status: active`.

    Omitting `save-state` creates a completed legacy-compatible Payroll. New integrations should
    use the draft/finalize flow.
  tags:
    - Payrolls
  requestBody:
    description: One Payroll parent or an array of Payroll parents.
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: "#/components/schemas/PayrollCreate"
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/PayrollCreate"
  responses:
    200:
      description: Created Payroll parent or parents.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Payroll"
              - type: array
                items:
                  $ref: "#/components/schemas/Payroll"
    400:
      description: Validation failed or a supplied save state was not `draft`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PayrollOperationError"
