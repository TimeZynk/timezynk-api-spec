get:
  summary: Fetch a Payroll row
  tags:
    - Payroll Rows
  parameters:
    - name: payrollRowId
      in: path
      required: true
      schema:
        type: string
        format: ObjectId
  responses:
    200:
      description: Payroll row.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PayrollRow"
    404:
      description: Payroll row not found.
